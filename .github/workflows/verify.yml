name: Verify Jac application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      UNIPATH_PUBLIC_ORIGINS: 'https://unipath-ci.example'
      UNIPATH_TEST_PUBLIC_ORIGIN: 'https://unipath-ci.example'
      UNIPATH_TEST_CLIENT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check all authored Jac modules
        run: |
          for source in main.jac services/*.jac components/*.jac scripts/*.jac tests/*.jac; do
            jac check "$source" --nowarn
          done
      - name: Native behavioural regressions
        run: jac test -d tests -v
      - name: Native client build and HTTP regressions from a clean checkout
        shell: bash
        run: |
          bash scripts/start.sh > /tmp/unipath-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 180); do
            if curl --fail --silent -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8000/walker/health > /tmp/unipath-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 /tmp/unipath-server.log
            exit 1
          fi
          jac run tests/http_regression.jac
