[project]
name = "unipath-lk"
version = "0.2.0"
description = "Evidence-aware education pathways for Sri Lankan post-A/L students across all fields"
entry-point = "main.jac"
jac-version = "0.16.7"
requires-python = ">=3.12,<3.13"

[dependencies]
jaclang = "==0.16.7"
byllm = "==0.6.19"

[dependencies.npm]
react = "18.3.1"
"react-dom" = "18.3.1"
"react-router-dom" = "6.30.6"
"react-error-boundary" = "5.0.0"
"react-hook-form" = "7.90.0"
zod = "4.6.7"
"@hookform/resolvers" = "5.9.1"

[dependencies.npm.dev]
vite = "6.4.4"
"@vitejs/plugin-react" = "4.7.0"
typescript = "5.9.3"
"@types/react" = "18.3.31"
"@types/react-dom" = "18.3.7"

[serve]
port = 8000
base_route_app = "app"

[test]
directory = "tests"
verbose = true
